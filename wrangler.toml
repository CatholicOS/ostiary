name = "ostiary"
compatibility_date = "2025-01-01"
pages_build_output_dir = "src"

# =============================================================================
# Ostiary: usher formation and meeting organization.
# =============================================================================
# Its own D1, deliberately NOT lachurches-db. This database holds parishioner
# names, emails, and phone numbers; lachurches-db is a public directory.
# Keep the boundary. See docs/PLAN.md.
# =============================================================================

[[d1_databases]]
binding = "DB"
database_name = "ostiary-db"
# Placeholder. Replace with the id printed by `wrangler d1 create ostiary-db`.
#
# It is deliberately an obviously-fake all-zero UUID rather than an empty
# string: `wrangler pages dev` asserts on an empty database_id and dies with
# "The expression evaluated to a falsy value", which tells you nothing. A
# well-formed but nonexistent id still fails loudly at deploy time with
# "D1 database not found", which is the behaviour we actually wanted.
database_id = "d1badac0-095e-4db1-89e9-e8830aee0086"

# Secrets, set with:
#   wrangler pages secret put SESSION_SECRET --project-name=ostiary
#
#   SESSION_SECRET  - HMAC key for signed session cookies. 32+ random bytes.
#                     Generate: openssl rand -base64 32
#
# There is no fallback value. If SESSION_SECRET is unset the API returns 503
# on every authenticated route instead of signing cookies with a default,
# which would let anyone forge a coordinator session.
#
#   GOOGLE_CLIENT_ID     - OAuth client id from the Google Cloud console.
#   GOOGLE_CLIENT_SECRET - Its secret. Set both with `wrangler pages secret put`.
#
# Both are optional. Unset, every /api/google/* route answers 503 "Google is
# not configured" and the app works exactly as it did without the Google
# layer: join-code sign-in, no calendar invites, no group sync. Setup runbook:
# docs/GOOGLE.md. Note that Google refresh tokens are encrypted at rest under
# a key derived from SESSION_SECRET, so rotating SESSION_SECRET invalidates
# them; the coordinator reconnects from the admin screen and nothing is lost.
